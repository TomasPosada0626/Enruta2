# Infraestructura local de Enruta2 (solo desarrollo).
# Uso: pnpm infra:up  (espera a que los health checks pasen)
#
# Los puertos se publican solo en 127.0.0.1 para no exponerlos a la red local.
# PostGIS usa 15432 en el host: evita choques con PostgreSQL instalado localmente (5432, 5433)
# y con los rangos de puertos que Windows reserva para Hyper-V.
#
# OSRM y VROOM están en el perfil "routing" porque necesitan datos preparados antes:
#   pnpm routing:prepare   (una vez: descarga y procesa el mapa del Valle de Aburrá)
#   pnpm routing:up

name: enruta2

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: enruta2
      POSTGRES_PASSWORD: enruta2 # credencial solo para desarrollo local
      POSTGRES_DB: enruta2
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      # Desde PostgreSQL 18 la imagen guarda los datos en /var/lib/postgresql/<versión>/docker,
      # así que el volumen se monta en /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: así no reporta "listo" mientras corren los scripts de inicio
      # (el servidor temporal de initdb solo escucha por socket).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U enruta2 -d enruta2']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # Tiempos y rutas por las vías reales (OpenStreetMap), con el algoritmo MLD.
  osrm:
    profiles: [routing]
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/valle-aburra.osrm
    volumes:
      - ./infra/routing/data:/data:ro
    ports:
      - '127.0.0.1:${OSRM_PORT:-5000}:5000'

  # Optimización del orden de paradas (vroom-express sobre VROOM), usando OSRM.
  vroom:
    profiles: [routing]
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./infra/routing/vroom:/conf
    ports:
      # 3001 en el host porque la API usa el 3000.
      - '127.0.0.1:${VROOM_PORT:-3001}:3000'
    depends_on:
      - osrm

volumes:
  postgres-data:
