# Configuración de vroom-express v0.12.0 (incluido en vroom-docker v1.15.0).
# Igual a la de fábrica, salvo el host de OSRM: el contenedor "osrm" de docker-compose.
cliArgs:
  geometry: false # no se piden geometrías: el orden y los tiempos bastan
  planmode: false
  threads: 4
  explore: 5 # nivel máximo de exploración (0..5)
  limit: '1mb'
  logdir: '/..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: 'osrm'
      port: '5000'
